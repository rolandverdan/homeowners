<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f6f7f5" /><title>Monthly dues — Bistek Village</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./styles.css" /></head>
  <body class="bg-canvas font-sans text-ink antialiased" data-page="payments"><div id="app-shell"></div><div id="page-content" class="hidden">
    <section>
      <div class="page-heading"><div><p class="eyebrow">COMMUNITY DUES COLLECTION</p><h1>Monthly dues</h1><p class="heading-subtitle">Track monthly village dues and follow up on unpaid residents.</p></div><div class="heading-actions"><button class="button button-secondary" id="payments-export-button">↓ Export report</button></div></div>
      <div class="payment-summary-grid"><div class="summary-tile"><span>Collected</span><strong id="payments-collected">₱0</strong><small id="payments-paid-count">0 residents paid</small></div><div class="summary-tile"><span>Pending</span><strong id="payments-pending">₱0</strong><small id="payments-pending-count">0 payments remaining</small></div><div class="summary-tile"><span>Monthly expected</span><strong id="payments-expected">₱0</strong><small id="payments-month-label"></small></div></div>
      <section class="panel directory-panel"><div class="panel-heading directory-heading"><div><p class="eyebrow">DUES REGISTER</p><h2 id="payments-page-count">All payments</h2></div><label class="search-box"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input id="payment-search" type="search" placeholder="Search residents..." /></label></div><div class="table-wrap"><table><thead><tr><th>RESIDENT</th><th>PROPERTY</th><th>MONTHLY DUES</th><th>DUE DATE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="payments-table"></tbody></table></div><div class="empty-state hidden" id="payments-empty">No payments match your search.</div></section>
    </section>
  </div><script src="./auth.js"></script><script src="./app-shell.js"></script><script src="./app.js"></script></body>
</html>
