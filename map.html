<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f6f7f5" /><title>Community map — Bistek Village</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./styles.css" /></head>
  <body class="bg-canvas font-sans text-ink antialiased" data-page="map"><div id="app-shell"></div><div id="page-content" class="hidden">
    <section>
      <div class="page-heading"><div><p class="eyebrow">PROPERTY DIRECTORY</p><h1>Community map</h1><p class="heading-subtitle">Find each home and resident in your neighborhood.</p></div><div class="heading-actions"><span class="map-live-chip"><i></i><span id="map-home-count">0 homes</span></span></div></div>

    </section>
  </div><script src="./auth.js"></script><script src="./app-shell.js"></script><script src="./app.js"></script></body>
</html>
