<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f6f7f5" /><title>Settings — Bistek Village</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /><link rel="stylesheet" href="./styles.css" /></head>
  <body class="bg-canvas font-sans text-ink antialiased" data-page="settings"><div id="app-shell"></div><div id="page-content" class="hidden">
    <section>
      <div class="page-heading"><div><h1>Settings</h1><p class="heading-subtitle">Keep your community information up to date.</p></div></div>
      <section class="panel settings-panel"><div class="panel-heading"><div><p class="eyebrow">COMMUNITY DETAILS</p><h2>Basic information</h2></div></div><form id="settings-form" class="settings-form"><label>Village name<input name="communityName" value="Bistek Village" required /></label><label>Default monthly village dues (₱)<input name="defaultMonthlyDues" type="number" min="0" step="50" value="0" required /></label><label>Village dues due day of the month<input name="dueDay" type="number" min="1" max="28" value="5" required /></label><div class="settings-actions"><span id="settings-saved" role="status"></span><button class="button button-primary" type="submit">Save changes</button></div></form></section>
      <section class="panel admin-account-panel"><div class="panel-heading"><div><p class="eyebrow">ADMIN ACCOUNT</p><h2>Sign-in details</h2></div></div><form id="admin-account-form" class="admin-account-form"><label>Current email<input id="admin-current-email" type="email" readonly /></label><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required /></label><label>New email address <small>Optional</small><input name="newEmail" type="email" autocomplete="email" placeholder="Leave empty to keep current email" /></label><label>New password <small>Optional</small><input name="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" /></label><label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" /></label><div class="admin-account-actions"><span id="admin-account-status" role="status" aria-live="polite"></span><button class="button button-primary" id="admin-account-submit" type="submit">Update sign-in details</button></div><p class="admin-account-help">Changing your email sends a verification link to the new address. Enter your current password to confirm any change.</p></form></section>
    </section>
  </div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="./auth.js"></script><script src="./app-shell.js"></script><script type="module" src="./app.js"></script></body>
</html>
