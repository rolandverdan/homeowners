<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f5" />
    <title>Admin sign in — Bistek Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
      <link rel="manifest" href="./manifest.json" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-brand-panel">
        <a class="brand login-brand" href="login.html" aria-label="Haven sign in">
          <span class="brand-mark"><img src="./images/logo.jpg" alt="" aria-hidden="true" /></span>
          <span class="brand-name">Home Owners Association<span>.</span><small>BISTEK VILLAGE ADMIN</small></span>
        </a>
        <div class="login-promo">
          <h1>A better way to<br />care for your<br /><span>community.</span></h1>
        </div>
        <small class="login-copyright">© <span id="copyright-year"></span> Bistek Village Admin</small>
      </section>
      <section class="login-form-panel">
        <div class="login-form-wrap">
          <p class="eyebrow">ADMINISTRATOR ACCESS</p>
          <h2>Welcome back</h2>
          <p class="login-subtitle">Sign in to manage your community workspace.</p>
          <form id="login-form" class="login-form">
            <label for="login-email">Email address</label>
            <div class="login-input-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="login-email" name="email" type="email" autocomplete="username" placeholder="admin@haven.local" required /></div>
            <div class="password-label-row"><label for="login-password">Password</label><span>Admin account only</span></div>
            <div class="login-input-wrap"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required /><button class="password-toggle" id="password-toggle" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <p class="login-error hidden" id="login-error" role="alert"></p>
            <button class="button button-primary login-submit" type="submit">Sign in <span>→</span></button>
          </form>
        </div>
      </section>
    </main>
    <script>document.body.dataset.page = "login"; document.getElementById("copyright-year").textContent = new Date().getFullYear();</script>
    <script src="./pwa.js"></script>
    <script type="module" src="./login.js"></script>
  </body>
</html>
